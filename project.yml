name: HoldSpeak
options:
  bundleIdPrefix: com.timmal
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.0.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
  # Parakeet (local engine). Needs macOS 14, so only HoldSpeakParakeet links it.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES
    Release:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES

targets:
  HoldSpeak:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/App
      - path: Sources/UI
      - path: Sources/Core
      - path: Sources/ObjCCatch
      - path: Sources/Whisper
        optional: true
      - path: Sources/ParakeetShared
      - path: Resources/radio.svg
        buildPhase: resources
      - path: Resources/settings.svg
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/terminology-default-ru.json
        buildPhase: resources
      - path: Resources/terminology-default-uk.json
        buildPhase: resources
      - path: Resources/terminology-default-en.json
        buildPhase: resources
    dependencies:
      - package: GRDB
        product: GRDB
      - package: WhisperKit
        product: WhisperKit
      # Embedded, not linked: the app (macOS 13) loads it at runtime on macOS 14+.
      - target: HoldSpeakParakeet
        link: false
        embed: true
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: HoldSpeak
        CFBundleName: HoldSpeak
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.5.1"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: HoldSpeak records your speech while you hold the hotkey and turns it into text.
        NSHumanReadableCopyright: ""
    entitlements:
      path: Resources/HoldSpeak.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timmal.push-to-talk
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/HoldSpeak-Bridging-Header.h
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO

  # Parakeet engine (FluidAudio). FluidAudio needs macOS 14 and Swift won't import a
  # module built for a newer macOS than the importer, so this framework is built for 14,
  # embedded in the app and loaded at runtime (ParakeetTranscriber.swift) — the app
  # itself keeps supporting macOS 13.
  HoldSpeakParakeet:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Parakeet
      - path: Sources/ParakeetShared
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timmal.push-to-talk.parakeet
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: NO
